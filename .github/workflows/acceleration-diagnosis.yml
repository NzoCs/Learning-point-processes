name: Paired acceleration kernel normalization and quota diagnosis
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [FullyNN, RMTPP]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Verify paired diagnostic controls
        run: uv run --frozen --no-sync python -m pytest -o addopts= tests/scripts/test_acceleration_diagnosis.py -q
      - name: Run prespecified paired ablations
        run: >-
          uv run --frozen --no-sync python -m scripts.acceleration_diagnosis
          --model ${{ matrix.model }}
          --output artifacts/acceleration-diagnosis-${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceleration-diagnosis-${{ matrix.model }}
          path: artifacts/acceleration-diagnosis-${{ matrix.model }}/
          retention-days: 30
