name: Test pipeline

on:
  push:
    branches: [main, master, codex/pysiglib-migration]
  pull_request:
    branches: [main, master]

jobs:
  signature-migration:
    runs-on: ubuntu-latest
    env:
      TORCH_COMPILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install locked pySigLib
        run: |
          pip install uv
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
          uv run --frozen --no-sync python -c 'import pysiglib; print(pysiglib.__version__)'
      - name: Check CPU signature recurrence and gradients
        run: >-
          uv run --frozen --no-sync python -m pytest -o addopts=
          tests/stat_metrics/test_signature_migration.py tests/stat_metrics/test_sig_kernel.py -q

  packaging-and-launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install build tool
        run: pip install uv
      - name: Build distribution
        run: uv build --wheel --no-sources
      - name: Check wheel and Ruche launch plans
        run: >-
          uv run --no-project --python 3.11
          --with pytest==8.4.2 --with pyyaml==6.0.2
          python -m pytest -o addopts=
          tests/scripts/test_ruche_launcher.py tests/scripts/test_wheel_contents.py -q

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --group dev

      - name: Run tests
        run: |
          uv run --frozen --no-sync python -m pytest tests
