name: Conditional repeat resume and learned calibration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [ANHN, ANHP, FullyNN, Hawkes, IntensityFree, NHP, ODETPP, RMTPP, SAHP, SelfCorrecting, THP]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Exact conditional repeats and checkpoint resume
        run: >-
          uv run --frozen --no-sync python -m scripts.conditional_reproducibility
          --model ${{ matrix.model }} --output artifacts/conditional-validation/reproducibility
      - name: Learned conditional H0 and H1
        if: ${{ !cancelled() }}
        run: >-
          uv run --frozen --no-sync python -m scripts.learned_conditional_calibration
          --model ${{ matrix.model }} --output artifacts/conditional-validation/calibration
          --trials 500 --power-trials 200 --permutations 99 --steps 200
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-validation-${{ matrix.model }}
          path: artifacts/conditional-validation
          retention-days: 30
