name: Global conditional MMD integration on all models
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5b41f13fb4eee9abba4754df45959cb5a1b0c46a
          path: artifacts/global-pipeline-before-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Capture reviewed parent on this same Linux runner
        run: >-
          uv run --frozen --no-sync python scripts/global_pipeline_validation.py
          --capture --code-root artifacts/global-pipeline-before-code
          --output artifacts/global-pipeline-before
      - name: Compare all models and check repeat, replay, resume and restart
        run: >-
          uv run --frozen --no-sync python scripts/global_pipeline_validation.py
          --reference-dir artifacts/global-pipeline-before --output artifacts/global-pipeline-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-pipeline-linux
          path: |
            artifacts/global-pipeline-before
            artifacts/global-pipeline-after
          retention-days: 30
