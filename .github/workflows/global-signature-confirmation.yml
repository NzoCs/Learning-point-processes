name: Independent FullyNN global-signature H0 confirmation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        epoch: [1, 2]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Verify exact global statistic
        run: >-
          uv run --frozen --no-sync python -m pytest -o addopts=
          tests/stat_metrics/test_global_signature.py -q
      - name: Independent predeclared 1000-trial H0 confirmation
        run: >-
          uv run --frozen --no-sync python -m scripts.global_signature_calibration
          --model-name FullyNN --epoch-number ${{ matrix.epoch }}
          --hypothesis H0 --trials 1000 --seed 2026101441 --confirmation
          --output artifacts/global-signature-confirmation-${{ matrix.epoch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-signature-confirmation-${{ matrix.epoch }}
          path: artifacts/global-signature-confirmation-${{ matrix.epoch }}/
          retention-days: 30
