name: Independent simulator references

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Measure independent references and report scientific findings
        run: >-
          uv run --frozen --no-sync python -m scripts.independent_simulator_validation
          --size 4096 --output artifacts/independent-simulators
      - name: Preserve results including current mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-simulators-linux
          path: artifacts/independent-simulators
          retention-days: 30
