name: Code Quality & Linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Check formatting and import order
        run: |
          uv run --frozen --no-sync black --check new_ltpp scripts tests
          uv run --frozen --no-sync isort --check-only new_ltpp scripts tests
      - name: Check syntax and undefined names
        run: uv run --frozen --no-sync ruff check --select E9,F63,F7,F82 new_ltpp scripts tests
      - name: Report type diagnostics
        continue-on-error: true
        run: uv run --frozen --no-sync mypy new_ltpp --ignore-missing-imports --no-strict-optional
      - name: Report Bandit diagnostics
        continue-on-error: true
        run: uv run --frozen --no-sync bandit -r new_ltpp -f json -o bandit-report.json
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Validate checked-in notebook documents
        run: |
          uv run --frozen --no-sync python -c "from pathlib import Path; import nbformat; [nbformat.validate(nbformat.read(p, as_version=4)) for p in Path('notebooks').rglob('*.ipynb')]"
