name: Parametric architecture and independent references

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment and isolated benchmark tools
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
          uv pip install --no-deps HawkesPyLib==0.3.0 numba==0.63.1 llvmlite==0.46.0
      - name: Historical neural references and all conditional models
        run: uv run --frozen --no-sync python -m scripts.architecture_regression --output artifacts/parametric-refactor/architecture
      - name: Independent distributions and execution times
        run: uv run --frozen --no-sync python -m scripts.parametric_benchmark --samples 4096 --repeats 7 --output artifacts/parametric-refactor/benchmark
      - name: Exact parametric repeat, checkpoint replay and training resume
        run: |
          for model in Hawkes SelfCorrecting Poisson; do
            uv run --frozen --no-sync python -m scripts.conditional_reproducibility --model "$model" --output "artifacts/parametric-refactor/repeat/$model"
          done
      - name: Independent marked and neural simulator diagnostics
        run: uv run --frozen --no-sync python -m scripts.independent_simulator_validation --size 4096 --output artifacts/parametric-refactor/independent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parametric-refactor-linux
          path: artifacts/parametric-refactor
          retention-days: 30
