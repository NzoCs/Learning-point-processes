name: Extended scientific validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Validate learned models and multiple marks
        run: >-
          uv run --frozen --no-sync python -m scripts.extended_scientific_validation
          --trials 300 --diagnostic-trials 100 --permutations 99 --steps 200
      - name: Check the analytic first-arrival distribution of learned NHP
        run: >-
          uv run --frozen --no-sync python -m scripts.extended_scientific_validation
          --first-arrival-only --seed 20261014 --steps 200
          --output artifacts/extended-scientific/first-arrival
      - name: Preserve experiment report and fitted checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-extended-linux
          path: artifacts/extended-scientific
          retention-days: 30
