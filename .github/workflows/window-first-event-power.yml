name: Sparse-window first-event power control
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-event:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        epoch: [1, 2]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Validate diagnostic controls
        run: >-
          uv run --frozen --no-sync python -m pytest -o addopts=
          tests/stat_metrics/test_window_power_diagnosis.py -q
      - name: Exact first-event law at increasing sample sizes
        run: >-
          uv run --frozen --no-sync python -m scripts.window_first_event_power
          --epoch-number ${{ matrix.epoch }}
          --output artifacts/window-first-event-${{ matrix.epoch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-first-event-${{ matrix.epoch }}
          path: artifacts/window-first-event-${{ matrix.epoch }}/
          retention-days: 30
