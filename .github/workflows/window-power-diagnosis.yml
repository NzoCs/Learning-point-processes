name: Frozen-model fixed-window power diagnosis
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [FullyNN, RMTPP]
        epoch: [1, 2]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU environment
        run: |
          python -m pip install uv==0.11.29
          uv sync --frozen --no-default-groups --group dev --no-build-package pysiglib
      - name: Validate diagnostic controls
        run: >-
          uv run --frozen --no-sync python -m pytest -o addopts=
          tests/stat_metrics/test_window_power_diagnosis.py -q
      - name: Compare kernels and sample sizes on identical frozen-model data
        run: >-
          uv run --frozen --no-sync python -m scripts.window_power_diagnosis
          --model-name ${{ matrix.model }} --epoch-number ${{ matrix.epoch }}
          --output artifacts/window-power-${{ matrix.model }}-${{ matrix.epoch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-power-${{ matrix.model }}-${{ matrix.epoch }}
          path: artifacts/window-power-${{ matrix.model }}-${{ matrix.epoch }}/
          retention-days: 30
